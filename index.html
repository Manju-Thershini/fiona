<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Fiona ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Great+Vibes&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#07030f; --bg2:#140828; --violet:#9b5cff; --lilac:#d2b4ff; --pink:#ff7ad9; --glow:rgba(155,92,255,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,var(--bg2),var(--bg1) 70%);color:#eee;font-family:'Cormorant Garamond',serif}
canvas#stars{position:fixed;inset:0;z-index:0}
.page{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;transition:opacity 1.2s ease, transform 1.2s ease}
.page.hidden{opacity:0;pointer-events:none;transform:scale(1.08)}

/* ---------- LOGIN ---------- */
#login{perspective:1200px}
.card{
  width:min(92vw,400px);padding:46px 36px 38px;border-radius:26px;text-align:center;position:relative;
  background:linear-gradient(145deg,rgba(60,25,110,.45),rgba(15,6,35,.75));
  border:1px solid rgba(190,150,255,.28);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 90px var(--glow),inset 0 1px 0 rgba(255,255,255,.12);
  transform-style:preserve-3d;transition:transform .15s ease-out;
}
.card .moon{
  width:84px;height:84px;margin:-82px auto 14px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#e0ccff 35%,#9b5cff 80%);
  box-shadow:0 0 40px 8px var(--glow),inset -12px -10px 22px rgba(60,20,120,.6);
  transform:translateZ(70px);animation:bob 5s ease-in-out infinite;
}
.card h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:46px;color:var(--lilac);text-shadow:0 0 18px var(--glow);transform:translateZ(40px)}
.card p.sub{font-style:italic;color:#b9a3de;margin:4px 0 26px;font-size:18px;transform:translateZ(25px)}
.field{margin-bottom:16px;transform:translateZ(30px)}
.field input{
  width:100%;padding:14px 18px;border-radius:14px;border:1px solid rgba(190,150,255,.3);
  background:rgba(10,4,25,.6);color:#f3eaff;font:600 18px 'Cormorant Garamond',serif;letter-spacing:.5px;outline:none;transition:.3s;
}
.field input::placeholder{color:#8d78b8;font-weight:400}
.field input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(155,92,255,.25),0 0 24px var(--glow)}
button.main{
  margin-top:8px;width:100%;padding:14px;border:0;border-radius:14px;cursor:pointer;
  font:700 19px 'Cormorant Garamond',serif;letter-spacing:2px;color:#fff;text-transform:uppercase;
  background:linear-gradient(135deg,#7b3ff2,#c05cff 60%,#ff7ad9);
  box-shadow:0 10px 30px rgba(155,92,255,.5);transform:translateZ(40px);transition:.25s;
}
button.main:hover{filter:brightness(1.15);box-shadow:0 14px 40px rgba(200,100,255,.7)}
#err{height:22px;margin-top:12px;color:#ff9ad9;font-style:italic;opacity:0;transition:.3s}
#err.show{opacity:1}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.hint{margin-top:6px;font-size:14px;color:#7d6aa6;font-style:italic}
@keyframes bob{50%{transform:translateZ(70px) translateY(-8px)}}

/* ---------- GALLERY ---------- */
#gallery{perspective:1100px;overflow:hidden}
#scene{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .2s ease-out}
.photo{
  position:absolute;width:var(--w);aspect-ratio:3/4;border-radius:14px;padding:8px 8px 26px;cursor:zoom-in;
  background:linear-gradient(160deg,#f6eeff,#cdb6f2);
  box-shadow:0 25px 50px rgba(0,0,0,.65),0 0 40px rgba(155,92,255,.35);
  transform-style:preserve-3d;
  animation:float var(--d) ease-in-out infinite;animation-delay:var(--dl);
  opacity:0;animation-fill-mode:both;transition:opacity 1s,box-shadow .3s;
}
.photo.in{opacity:1}
.photo:hover{box-shadow:0 30px 60px rgba(0,0,0,.7),0 0 70px rgba(210,150,255,.8)}
.photo .img{width:100%;height:100%;border-radius:8px;background-size:cover;background-position:center;background-color:#3a1f66;
  display:flex;align-items:center;justify-content:center;font-size:34px;color:#c9a8ff}
.photo::after{content:'';position:absolute;inset:0;border-radius:14px;background:linear-gradient(120deg,rgba(255,255,255,.35),transparent 40%);pointer-events:none}
@keyframes float{
  0%,100%{transform:translate3d(0,0,var(--z)) rotateZ(var(--r)) rotateY(-8deg) rotateX(4deg)}
  50%{transform:translate3d(14px,-28px,calc(var(--z) + 40px)) rotateZ(calc(var(--r) * -1)) rotateY(10deg) rotateX(-4deg)}
}
.title{position:absolute;top:4vh;width:100%;text-align:center;z-index:5;pointer-events:none}
.title h2{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(40px,7vw,84px);color:#f0e3ff;text-shadow:0 0 30px var(--violet),0 0 70px var(--glow)}
.title p{font-style:italic;color:#bfa7e6;letter-spacing:3px;font-size:clamp(12px,1.4vw,18px)}

/* ---------- 3D DOLL ---------- */
#dollWrap{
  position:absolute;left:50%;top:48%;width:var(--dw);aspect-ratio:1312/1199;
  transform:translate(-50%,-50%);perspective:900px;z-index:3;
  --dw:clamp(190px,27vw,350px);
}
#dollBob{position:absolute;inset:0;transform-style:preserve-3d;animation:dollbob 5.5s ease-in-out infinite}
@keyframes dollbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
#doll{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
#dollWrap{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#dollWrap.drag{cursor:grabbing}
#dollFx{position:absolute;left:50%;top:48%;width:var(--dw);aspect-ratio:1312/1199;transform:translate(-50%,-50%);pointer-events:none;--dw:clamp(190px,27vw,350px)}

.layer::after{content:'';position:absolute;inset:0;border-radius:inherit;background:rgba(40,12,85,.62)}
.layer.front{box-shadow:0 0 0 3px rgba(255,255,255,.55),0 0 60px rgba(170,110,255,.7)}
.layer.front::after{background:linear-gradient(115deg,rgba(255,255,255,.0) 30%,rgba(255,255,255,.0) 100%)}
.glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle at var(--gx,30%) var(--gy,20%),rgba(255,255,255,.5),rgba(255,255,255,0) 45%);mix-blend-mode:soft-light}
.rim{position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),inset 0 0 30px rgba(210,170,255,.35)}
.layer.back{background:linear-gradient(150deg,#4a1f99,#1b0a3d 70%);transform:rotateY(180deg) translateZ(32px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;color:#eadcff;box-shadow:inset 0 0 0 3px rgba(210,170,255,.5)}
.layer.back::after{display:none}
.layer.back b{font:400 clamp(34px,5vw,60px) 'Great Vibes',cursive;text-shadow:0 0 20px var(--violet)}
.layer.back i{font-size:clamp(12px,1.4vw,17px);letter-spacing:3px}
.floor{position:absolute;left:50%;bottom:-9%;width:92%;height:12%;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(170,110,255,.75),rgba(120,60,220,.25) 55%,transparent 72%);
  filter:blur(3px);animation:shadow 5.5s ease-in-out infinite}
@keyframes shadow{0%,100%{transform:translateX(-50%) scale(1);opacity:.95}50%{transform:translateX(-50%) scale(.82);opacity:.6}}
.orb{position:absolute;left:50%;top:50%;font-size:20px;color:#e2c8ff;text-shadow:0 0 12px var(--violet),0 0 24px var(--pink);pointer-events:none}
#dollHint{position:absolute;left:50%;bottom:-16%;transform:translateX(-50%);white-space:nowrap;font-style:italic;letter-spacing:3px;
  color:#cdb2f7;text-shadow:0 0 12px var(--violet);font-size:clamp(12px,1.3vw,16px);transition:opacity 1s;pointer-events:none}

/* envelope */
#env{position:absolute;left:50%;bottom:4vh;transform:translateX(-50%);z-index:6;cursor:pointer;text-align:center;animation:pulse 2.6s ease-in-out infinite}
#env .e{width:130px;height:88px;margin:0 auto;position:relative;border-radius:6px;
  background:linear-gradient(135deg,#d9c3a0,#b99a6b);box-shadow:0 12px 35px rgba(0,0,0,.7),0 0 45px var(--glow)}
#env .e::before{content:'';position:absolute;inset:0;clip-path:polygon(0 0,50% 58%,100% 0);background:linear-gradient(#e6d3b3,#c8aa7b);border-radius:6px}
#env .seal{position:absolute;left:50%;top:44%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#c86cff,#5a1fb0);box-shadow:0 2px 8px #000;display:flex;align-items:center;justify-content:center;color:#f4e5ff;font-size:14px;z-index:2}
#env span{display:block;margin-top:10px;font-style:italic;letter-spacing:2px;color:#d9c3ff;text-shadow:0 0 12px var(--violet)}
@keyframes pulse{50%{transform:translateX(-50%) translateY(-8px) scale(1.04)}}

/* lightbox */
#lightbox{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(5,2,14,.88);
  opacity:0;pointer-events:none;transition:opacity .4s;cursor:zoom-out}
#lightbox.open{opacity:1;pointer-events:auto}
#lightbox img{max-width:88vw;max-height:86vh;border-radius:14px;border:8px solid #efe3ff;box-shadow:0 0 90px var(--glow);transform:scale(.8) rotate(-3deg);transition:transform .5s cubic-bezier(.2,1.3,.3,1)}
#lightbox.open img{transform:none}

/* ---------- LETTER ---------- */
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:rgba(5,2,14,.78);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .6s;perspective:1500px}
#overlay.open{opacity:1;pointer-events:auto}
.letter{
  position:relative;width:min(92vw,560px);max-height:88vh;overflow:auto;padding:46px 44px 40px;text-align:center;
  background:
   radial-gradient(ellipse at 20% 15%,rgba(255,255,255,.35),transparent 50%),
   radial-gradient(ellipse at 85% 90%,rgba(120,70,20,.35),transparent 55%),
   linear-gradient(160deg,#ecd9b0,#d2b283 60%,#b8925c);
  color:#3b2410;border-radius:6px;
  box-shadow:0 40px 100px rgba(0,0,0,.85),0 0 90px var(--glow),inset 0 0 70px rgba(110,60,10,.45);
  transform:translateY(120vh) rotateX(50deg) rotateZ(-8deg) scale(.6);opacity:0;
  transition:transform 1.1s cubic-bezier(.2,1.2,.3,1),opacity .6s;
}
#overlay.open .letter{transform:none;opacity:1}
.letter::before{content:'';position:absolute;inset:10px;border:1px solid rgba(90,50,15,.45);border-radius:3px;pointer-events:none}
.letter h3{font-family:'Great Vibes',cursive;font-weight:400;font-size:44px;color:#4b1f8f;margin-bottom:10px}
.letter .poem{font-family:'Special Elite','Cormorant Garamond',serif;font-size:17px;line-height:1.95}
.letter .poem p{margin-bottom:18px;opacity:0;transform:translateY(10px);transition:1s}
.letter .poem p.show{opacity:1;transform:none}
.letter .sign{font-family:'Great Vibes',cursive;font-size:34px;color:#4b1f8f;margin-top:8px;opacity:0;transition:1.2s}
.letter .sign.show{opacity:1}
.letter .stamp{position:absolute;top:18px;right:22px;font-size:11px;letter-spacing:2px;border:2px solid rgba(110,40,150,.6);color:rgba(110,40,150,.7);padding:4px 8px;transform:rotate(8deg);font-family:'Special Elite',serif}
.close{position:absolute;top:10px;left:14px;background:none;border:0;font-size:26px;color:#5a2f9c;cursor:pointer;z-index:2}
.petal{position:fixed;top:-20px;z-index:25;pointer-events:none;font-size:18px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media(max-width:600px){.letter{padding:40px 24px 30px}.letter .poem{font-size:15px}#dollWrap,#dollFx{--dw:46vw}}
</style>

/* ================= STARFIELD ================= */
const cv=document.getElementById('stars'),cx=cv.getContext('2d');let S=[];
function sizeCv(){cv.width=innerWidth;cv.height=innerHeight;S=Array.from({length:Math.min(260,innerWidth/4)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.6+.2,p:Math.random()*6,s:Math.random()*.02+.005,v:Math.random()*.15+.02}))}
addEventListener('resize',sizeCv);sizeCv();
(function loop(){cx.clearRect(0,0,cv.width,cv.height);
 for(const s of S){s.p+=s.s;s.y-=s.v;if(s.y<-5){s.y=cv.height+5;s.x=Math.random()*cv.width}
  const a=.35+.65*Math.abs(Math.sin(s.p));cx.beginPath();cx.fillStyle=`rgba(${200+Math.random()*20|0},${170},255,${a})`;cx.shadowBlur=8;cx.shadowColor='#b07cff';cx.arc(s.x,s.y,s.r,0,7);cx.fill()}
 requestAnimationFrame(loop)})();

const card=document.getElementById('card'),login=document.getElementById('login');
login.addEventListener('mousemove',e=>{const x=(e.clientX/innerWidth-.5),y=(e.clientY/innerHeight-.5);
  card.style.transform=`rotateY(${x*18}deg) rotateX(${-y*18}deg)`});
login.addEventListener('mouseleave',()=>card.style.transform='');
card.addEventListener('submit',e=>{
  e.preventDefault();
  const u=user.value.trim().toLowerCase();
  const p=pass.value.trim().replace(/[\/. ]/g,'-');
  if(u==='fiona' && (p==='20-10-2005'||p==='20102005')){
    login.classList.add('hidden');
    setTimeout(()=>{document.getElementById('gallery').classList.remove('hidden');buildGallery()},500);
  }else{
    err.classList.add('show');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
    setTimeout(()=>err.classList.remove('show'),2200);
  }
});

/* ================= GALLERY ================= */
let built=false;
function buildGallery(){
  if(built)return;built=true;
  const scene=document.getElementById('scene');
  // [x%, y%, width px, depth, tilt, duration] — arranged around the doll in the middle
  const pos=[[3,24,150,-60,-8,7],[19,53,145,70,6,8],[5,62,150,-90,5,9],
             [62,21,130,80,7,7.5],[77,30,150,-40,-6,8.5],[63,58,150,100,-5,6.5],[81,64,150,-70,8,8]];
  const mobile=innerWidth<700;
  const scale=mobile?Math.max(innerWidth/1100,.28)*1.9:Math.min(1,innerWidth/1250);
  PHOTOS.forEach((src,i)=>{
    const [x,y,w,z,r,d]=pos[i%pos.length];
    const wPx=Math.max(w*scale,mobile?78:100);
    const left=Math.min(x,(innerWidth-wPx-8)/innerWidth*100);
    const el=document.createElement('div');el.className='photo';
    el.style.cssText=`left:${left}%;top:${y}%;--w:${wPx}px;--z:${z}px;--r:${r}deg;--d:${d}s;--dl:${-i*1.1}s`;
    const im=document.createElement('div');im.className='img';
    const t=new Image();t.onload=()=>{im.style.backgroundImage=`url(${src})`;im.textContent=''};t.onerror=()=>{im.textContent='♥'};t.src=src;
    el.appendChild(im);
    el.addEventListener('click',()=>{lbImg.src=src;lightbox.classList.add('open')});
    scene.appendChild(el);
    setTimeout(()=>el.classList.add('in'),300+i*220);
  });
}
const lightbox=document.getElementById('lightbox'),lbImg=document.getElementById('lbImg');
lightbox.onclick=()=>lightbox.classList.remove('open');

const gallery=document.getElementById('gallery'),scene=document.getElementById('scene');
let mx=0,my=0;
function tilt(cx_,cy_){mx=cx_/innerWidth-.5;my=cy_/innerHeight-.5;
  scene.style.transform=`rotateY(${mx*10}deg) rotateX(${-my*8}deg) translate(${-mx*24}px,${-my*16}px)`}
gallery.addEventListener('mousemove',e=>tilt(e.clientX,e.clientY));
gallery.addEventListener('touchmove',e=>{const t=e.touches[0];tilt(t.clientX,t.clientY)},{passive:true});

const doll=document.getElementById('doll'),dollWrap=document.getElementById('dollWrap');
(function buildDoll(){
  const LAYERS=14,GAP=2.3;           // 14 stacked slices -> a solid acrylic-standee body
  const back=doll.querySelector('.back');
  for(let i=LAYERS-1;i>=0;i--){
    const l=document.createElement('div');l.className='layer'+(i===0?' front':'');
    l.style.transform=`translateZ(${-i*GAP}px)`;
    if(i===0){const g=document.createElement('div');g.className='glare';l.appendChild(g);
              const r=document.createElement('div');r.className='rim';l.appendChild(r)}
    doll.insertBefore(l,back);
  }
  back.style.transform=`rotateY(180deg) translateZ(${LAYERS*GAP-GAP+1}px)`;
  // little orbiting sparkles (flat 2D layer, so they never cut through the doll)
  const orbit=document.getElementById('orbit');
  for(let i=0;i<9;i++){const o=document.createElement('span');o.className='orb';o.textContent=['✦','✧','♥'][i%3];orbit.appendChild(o)}
})();

let dragging=false,lx=0,ly=0,dry=0,drx=0,hint=document.getElementById('dollHint'),t0=performance.now();
dollWrap.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;dollWrap.classList.add('drag');try{dollWrap.setPointerCapture(e.pointerId)}catch(_){}hint.style.opacity=0;e.preventDefault()});
addEventListener('pointermove',e=>{if(!dragging)return;dry+=(e.clientX-lx)*.6;drx-=(e.clientY-ly)*.3;drx=Math.max(-35,Math.min(35,drx));lx=e.clientX;ly=e.clientY});
addEventListener('pointerup',()=>{dragging=false;dollWrap.classList.remove('drag')});addEventListener('pointercancel',()=>{dragging=false;dollWrap.classList.remove('drag')});
const glare=()=>doll.querySelector('.glare');
(function animateDoll(now){
  const t=(now-t0)/1000;
  if(!dragging){                       // ease back to the nearest front-facing position
    const target=Math.round(dry/360)*360;dry+=(target-dry)*.04;drx+=(0-drx)*.05;
  }
  const sway=Math.sin(t*.9)*14, nod=Math.cos(t*.7)*3;
  const ry=dry+sway+mx*22, rx=drx+nod-my*12;
  doll.style.transform=`rotateY(${ry}deg) rotateX(${rx}deg)`;
  const g=glare();if(g){g.style.setProperty('--gx',(50+Math.sin((ry)*Math.PI/180)*-45+mx*30)+'%');g.style.setProperty('--gy',(30+my*40+rx*0.8)+'%')}
  const orbs=document.querySelectorAll('.orb'),W=dollWrap.offsetWidth;
  orbs.forEach((o,i)=>{const a=t*.7+i/orbs.length*Math.PI*2,c=Math.cos(a),sn=Math.sin(a);
    o.style.transform=`translate(-50%,-50%) translate(${c*W*.78}px,${sn*W*.22+W*.15}px) scale(${.7+.5*(sn+1)/2})`;
    o.style.opacity=.35+.65*(sn+1)/2});
  requestAnimationFrame(animateDoll);
})(performance.now());

/* ================= LETTER ================= */
const overlay=document.getElementById('overlay'),poem=document.getElementById('poem'),sign=document.getElementById('sign');
document.getElementById('env').onclick=()=>{
  poem.innerHTML=POEM.map(p=>`<p>${p}</p>`).join('');sign.classList.remove('show');
  overlay.classList.add('open');confetti();
  [...poem.children].forEach((p,i)=>setTimeout(()=>p.classList.add('show'),1300+i*1400));
  setTimeout(()=>sign.classList.add('show'),1300+POEM.length*1400);
};
document.getElementById('close').onclick=()=>overlay.classList.remove('open');
overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('open')});
function confetti(){
  const sym=['✦','♥','✧','❀','·'];
  for(let i=0;i<40;i++){const p=document.createElement('div');p.className='petal';
    p.textContent=sym[i%sym.length];p.style.left=Math.random()*100+'vw';
    p.style.color=['#d2b4ff','#ff7ad9','#9b5cff','#f3e6ff'][i%4];
    p.style.animationDuration=(3+Math.random()*3)+'s';p.style.animationDelay=Math.random()*1.2+'s';
    document.body.appendChild(p);setTimeout(()=>p.remove(),7500)}
}
</script>
